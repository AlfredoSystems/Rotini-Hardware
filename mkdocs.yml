site_name: Rotini
site_description: Practical documentation for the Rotini meltybrain control board (V3)
site_url: https://www.alfredosys.com/Rotini-Hardware/
repo_url: https://github.com/AlfredoSystems/Rotini-Hardware
repo_name: AlfredoSystems/Rotini-Hardware
edit_uri: edit/main/docs/
copyright: MIT License &copy; Alfredo Systems

nav:
  - Overview: index.md
  - "The Brain (ESP32-S2)": brain.md
  - "The Receiver (ESP8285)": receiver.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
